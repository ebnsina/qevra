# Local stand-ins for Neon (Postgres and object storage) and for mail. Used by the tests, and for working offline.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tadris_owner
      POSTGRES_PASSWORD: owner
      POSTGRES_DB: tadris
    ports: ['54329:5432']
    volumes:
      - pg:/var/lib/postgresql/data
      - ./scripts/local-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'tadris_owner', '-d', 'tadris_test']
      interval: 1s
      retries: 30
  storage:
    # S3 API stand-in for development; it accepts any access key. It forgets its files when it
    # restarts: run `pnpm db:seed` again to put the demo files back.
    image: adobe/s3mock
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: files
    ports: ['9010:9090']
  mailpit:
    image: axllent/mailpit
    ports: ['1026:1025', '8026:8025']
volumes:
  pg:
